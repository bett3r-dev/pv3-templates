services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./reload.sh:/docker-entrypoint.d/reload.sh
    ports:
      - "80:80"
      - "443:443"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip", "mongo"]
    volumes:
      - ./dev-env/mongodata:/data/db
      - ./init-mongo-replicaset.sh:/docker-entrypoint-initdb.d/init-mongo-replicaset.sh

  app:
    image: bett3rdev/integrador:latest
    container_name: app
    depends_on:
      - mongo
    ports:
      - "1984:1984"
    command: ["node", "index.js", "-siro"]
    restart: always
    volumes:
      - ./config.yaml:/app/config/local.yaml
